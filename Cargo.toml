[workspace]
resolver = "3"
members = ["crates/*", "tools/fmdump"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/ripleyXLR8/basecraft"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
