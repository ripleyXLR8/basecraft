[package]
name = "basecraft"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
eframe = "0.37"
engine = { version = "0.1.0", path = "../engine" }
fmp12 = { version = "0.1.0", path = "../fmp12" }
rfd = "0.18.0"
script = { version = "0.1.0", path = "../script" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["Window", "Document", "HtmlCanvasElement", "Navigator"] }
