[package]
name = "basecraft"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

description = "BaseCraft: create, browse and script databases; opens and saves .fmp12 files"

[package.metadata.deb]
name = "basecraft"
maintainer = "BaseCraft contributors"
copyright = "BaseCraft contributors"
license-file = ["../../LICENSE", "0"]
section = "database"
priority = "optional"
assets = [
    ["target/release/basecraft", "usr/bin/", "755"],
    ["target/release/basecraft-cli", "usr/bin/", "755"],
    ["../../packaging/linux/basecraft.desktop", "usr/share/applications/", "644"],
    ["../../assets/icon/basecraft-256.png", "usr/share/icons/hicolor/256x256/apps/basecraft.png", "644"],
]

[dependencies]
calc = { version = "0.1.0", path = "../calc" }
eframe = "0.37"
engine = { version = "0.1.0", path = "../engine" }
fmp12 = { version = "0.1.0", path = "../fmp12" }
print = { version = "0.1.0", path = "../print" }
rfd = "0.18.0"
script = { version = "0.1.0", path = "../script" }

# File › Open Remote… (FileMaker Data API); no sockets in the web build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
remote = { version = "0.1.0", path = "../remote" }

# Web viewers: native child webviews (WebView2, WKWebView). Linux would
# need GTK driven from the winit event loop (not done: placeholder).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
wry = { version = "0.58.2", default-features = false, features = ["os-webview"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["Window", "Document", "HtmlCanvasElement", "Navigator", "console"] }

[lints]
workspace = true

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["eframe", "wgpu", "snapshot"] }
egui_system_font_provider = "0.37.0"
