[package]
name = "fmp12"
version = "0.1.0"
description = "Reader for the FileMaker .fmp12 (HBAM7) file format"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# `std::time::SystemTime::now` panics in the browser; web-time reads the
# JavaScript clock there and is std on native (already in the tree via eframe).
web-time = "1.1.0"
hmac = "0.13.0"
md-5 = "0.11.0"
sha1 = "0.11.0"
# Word index: UAX #29 word boundaries, as FileMaker splits words.
unicode-segmentation = "1.13.3"

[dev-dependencies]
roxmltree = "0.21.2"

[lints]
workspace = true
