[package]
name = "fmp12"
version = "0.1.0"
description = "Reader for the FileMaker .fmp12 (HBAM7) file format"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# `std::time::SystemTime::now` panics in the browser; web-time reads the
# JavaScript clock there and is std on native (already in the tree via eframe).
web-time = "1.1.0"
hmac = "0.13.0"
# Encryption at rest (ear.rs): RustCrypto crates already in the tree.
aes = "0.9.4"
cbc = "0.2.1"
pbkdf2 = "0.13.0"
sha2 = "0.11.2"
# Salt and IVs of encrypted files (as in fmp12-calc; wasm_js uses the
# browser's crypto.getRandomValues).
getrandom = { version = "0.4.3", features = ["wasm_js"] }
# NFD of the encryption password (already in the tree via url/idna).
icu_normalizer = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
md-5 = "0.11.0"
sha1 = "0.11.0"
# Word index: UAX #29 word boundaries, as FileMaker splits words.
unicode-segmentation = "1.13.3"

[dev-dependencies]
roxmltree = "0.21.2"

[lints]
workspace = true
