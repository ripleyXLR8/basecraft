[package]
name = "print"
version = "0.1.0"
description = "Preview mode pagination and PDF output for BaseCraft layouts"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# `std::time::SystemTime::now` panics in the browser; web-time reads the
# JavaScript clock there and is std on native (already in the tree via eframe).
web-time = "1.1.0"
bigdecimal = "0.4.11"
calc = { version = "0.1.0", path = "../calc" }
engine = { version = "0.1.0", path = "../engine" }
fmp12 = { version = "0.1.0", path = "../fmp12" }
# Pictures (PNG, JPEG, BMP); already in the tree through eframe.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp"] }

[lints]
workspace = true
