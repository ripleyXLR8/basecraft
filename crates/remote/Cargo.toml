[package]
name = "remote"
version = "0.1.0"
description = "FileMaker Data API client: hosted files for BaseCraft"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
calc = { version = "0.1.0", path = "../calc" }
engine = { version = "0.1.0", path = "../engine" }
fmp12 = { version = "0.1.0", path = "../fmp12" }
serde_json = "1.0.154"

# Native only: the web build has no sockets (see lib.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }

[lints]
workspace = true
