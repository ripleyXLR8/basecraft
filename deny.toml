[advisories]
# All advisories (vulnerabilities, unmaintained, unsound, yanked) fail the check.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "OFL-1.1",
    # egui's bundled Ubuntu-Light font (epaint_default_fonts).
    "Ubuntu-font-1.0",
]
# The list is a policy, not an inventory: allowed licences no crate uses yet
# are fine.
unused-allowed-license = "allow"
# Mozilla's root certificates, used by the Data API client (crates/remote)
# to check FileMaker Server's TLS certificate. A permissive data licence.
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    # A build dependency of wry's Linux (WebKitGTK) bindings, in the graph
    # cargo-deny checks: Apache 2.0 with LLVM's permissive linking exception.
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "target-lexicon" },
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
